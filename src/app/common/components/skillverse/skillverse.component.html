<div class="country-tab-container">
<mat-tab-group (selectedIndexChange)="categoryChanged($event)">
  <mat-tab *ngFor="let cat of categories; let c = index" [label]="cat.name">

    <mat-tab-group (selectedIndexChange)="subcategoryChanged($event)" class="mt-3">
      <mat-tab *ngFor="let sub of cat.subcategories; let s = index" [label]="sub.title">

        <mat-tab-group (selectedIndexChange)="selectSubItem(sub.items[$event])" class="mt-3">
          <mat-tab *ngFor="let item of sub.items" [label]="item">
            <div class="p-3">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>{{ item }}</h3>
                  <div class="add-card-container" *ngIf="isSuperUser">
                <button mat-raised-button color="primary" *ngIf="isSuperUser" (click)="addCard(item)">
                  Add Card
                </button>
                </div>
              </div>

<div class="tab-content">
              <div class="cards-grid"  *ngIf="cards.length > 0; else noCards">
                <app-skillcard
                  *ngFor="let card of cards"
                  [card]="card"
                  [isSuperUser]="isSuperUser"
                  (edit)="editCard($event)"
                  (delete)="deleteCard($event)">
                </app-skillcard>
              </div>
              </div>

              <ng-template #noCards>
                <p>No cards available for this item yet.</p>
              </ng-template>
            </div>
          </mat-tab>
        </mat-tab-group>

      </mat-tab>
    </mat-tab-group>

  </mat-tab>
</mat-tab-group>
</div>
