<h2>{{ data?.title ? 'Edit Card' : 'Create Card' }}</h2>
<div mat-dialog-content class="form-container">
  <!-- Title - Full width -->
  <div class="form-row">
    <mat-form-field appearance="fill" class="form-field-full">
      <mat-label>Title</mat-label>
      <input matInput [(ngModel)]="title" />
    </mat-form-field>
  </div>

  <!-- Description - Full width -->
  <div class="form-row">
    <mat-form-field appearance="fill" class="form-field-full">
      <mat-label>Description</mat-label>
      <textarea matInput rows="3" [(ngModel)]="description"></textarea>
    </mat-form-field>
  </div>

  <!-- Country Code - Full width -->
  <div class="form-row">
    <mat-form-field appearance="fill" class="form-field-full">
      <mat-label>Country Code</mat-label>
      <input matInput [(ngModel)]="countryCode" />
    </mat-form-field>
  </div>

  <!-- Website Link and About Website Link - 2 per row -->
  <div class="form-row">
    <mat-form-field appearance="fill" class="form-field-half">
      <mat-label>Website Link</mat-label>
      <input matInput [(ngModel)]="websiteLink" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="form-field-half">
      <mat-label>About Website Link</mat-label>
      <input matInput [(ngModel)]="aboutWebsiteLink" />
    </mat-form-field>
  </div>

  <!-- About Country Link and YouTube Link - 2 per row -->
  <div class="form-row">
    <mat-form-field appearance="fill" class="form-field-half">
      <mat-label>About Country Link</mat-label>
      <input matInput [(ngModel)]="aboutCountryLink" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="form-field-half">
      <mat-label>YouTube Link</mat-label>
      <input matInput [(ngModel)]="youtubeLink" />
    </mat-form-field>
  </div>
</div>

<div mat-dialog-actions class="justify-end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()">Save</button>
</div>
