<!doctype html>
<html lang="en">
<head>

  <!-- Mobile Friendly -->

  <!-- SEO Meta Tags -->

  <meta name="keywords" content="TheOneTik, global opportunities, visas, education, study abroad, recruitment, jobs, migration, Skillverse, IT skills, Digital skills, E-commerce skills, AI prompts, professional learning">

  <!-- Open Graph for Social Media -->

  <meta property="og:url" content="https://theonetik.com/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TheOneTik | Global Opportunities, Visas, Education & Skillverse">

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- JSON-LD Structured Data for Skills & Portal -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "TheOneTik",
    "url": "https://theonetik.com/",
    "description": "Global portal for visas, education, jobs, and Skillverse for IT, digital, e-commerce skills and AI prompts.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://theonetik.com/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    },
    "about": [
      {
        "@type": "EducationalOccupationalProgram",
        "name": "Skillverse",
        "educationalProgramMode": "Online",
        "course": [
          {"name": "IT Skills"},
          {"name": "Digital Skills"},
          {"name": "E-commerce Skills"},
          {"name": "AI Prompts"}
        ]
      }
    ]
  }
  </script>
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
